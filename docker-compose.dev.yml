# Local development: PostgreSQL only. The API and web app run on the host (see CLAUDE.md Commands).
# Usage: cp .env.example .env, then docker compose -f docker-compose.dev.yml up -d
name: fitness-merchant-dev

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only; 5433 avoids clashing with a locally installed PostgreSQL.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
