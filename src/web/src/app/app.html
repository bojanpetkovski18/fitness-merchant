<a
  href="#main"
  class="sr-only z-50 rounded-md bg-accent px-4 py-2 font-bold text-on-accent focus:not-sr-only focus:fixed focus:left-4 focus:top-4"
  (click)="skipToContent($event)"
  >Skip to content</a
>

<div class="flex min-h-dvh flex-col">
  <app-demo-banner />
  <app-site-header />

  <!-- At least a screen tall, so the footer starts below the fold and cannot jump when content loads (M12, CLS). -->
  <main #main id="main" tabindex="-1" class="min-h-dvh flex-1 outline-none">
    <router-outlet />
  </main>

  <app-site-footer />
</div>

<app-toast-host />
