<section class="mx-auto max-w-md px-4 py-12 md:py-16">
  <h1 class="fm-display text-3xl md:text-4xl">Sign in</h1>
  <p class="mt-2 text-muted">
    New to Fitness Merchant?
    <a
      routerLink="/register"
      [queryParams]="returnUrl() ? { returnUrl: returnUrl() } : {}"
      class="font-semibold text-accent underline underline-offset-4"
      >Create an account</a
    >
  </p>

  <div aria-live="assertive">
    @if (problem(); as problem) {
      <p
        role="alert"
        class="mt-6 rounded-md border border-danger/50 bg-danger/10 px-4 py-3 text-sm font-semibold text-danger"
      >
        {{ problem.title }}
      </p>
    }
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="mt-6 space-y-5">
    @let emailError = error('email', 'Email');
    <div>
      <label for="email" class="block text-sm font-semibold">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        [attr.aria-invalid]="emailError ? 'true' : null"
        [attr.aria-describedby]="emailError ? 'email-error' : null"
        class="mt-1 block w-full rounded-md border border-border bg-surface px-3 py-2.5 text-fg aria-invalid:border-danger"
      />
      @if (emailError) {
        <p id="email-error" class="mt-1 text-sm text-danger">{{ emailError }}</p>
      }
    </div>

    @let passwordError = error('password', 'Password');
    <div>
      <label for="password" class="block text-sm font-semibold">Password</label>
      <div class="relative mt-1">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="passwordError ? 'true' : null"
          [attr.aria-describedby]="passwordError ? 'password-error' : null"
          class="block w-full rounded-md border border-border bg-surface py-2.5 pl-3 pr-20 text-fg aria-invalid:border-danger"
        />
        <button
          type="button"
          class="absolute inset-y-1 right-1 rounded px-3 text-sm font-semibold text-muted hover:text-fg"
          aria-controls="password"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}<span class="sr-only"> password</span>
        </button>
      </div>
      @if (passwordError) {
        <p id="password-error" class="mt-1 text-sm text-danger">{{ passwordError }}</p>
      }
    </div>

    <button
      type="submit"
      [disabled]="pending()"
      class="w-full rounded-md bg-accent px-4 py-3 font-bold text-on-accent hover:bg-accent-strong disabled:opacity-60"
    >
      {{ pending() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</section>
